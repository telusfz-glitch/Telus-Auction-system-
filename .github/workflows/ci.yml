name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Throwaway credentials for the ephemeral CI services (see scripts/ci/prepare-services.sh).
  TEST_DB_ADMIN_URL: postgres://telus_owner:owner@localhost:5432/telus_test
  TEST_DB_APP_URL: postgres://telus_app:app@localhost:5432/telus_test
  TEST_REDIS_URL: redis://localhost:6379
  TEST_KEYCLOAK_ISSUER: http://localhost:8080/realms/telus
  TEST_KEYCLOAK_ADMIN_SECRET: e2e-api-admin-secret-0123456789
  TEST_S3_ENDPOINT: http://127.0.0.1:5055

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --no-audit --no-fund
      # Fails on any known vulnerability of high severity or worse in production dependencies.
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks 8.28.0 (checksum-pinned)
        run: |
          curl -sSLo gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      # Every commit, with the narrow fixture allow-list in .gitleaks.toml. Findings are redacted in the log.
      - run: ./gitleaks git --redact --no-banner --exit-code 1 .

  api:
    name: API — typecheck, unit, database, Redis, Keycloak
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: scripts/ci/prepare-services.sh
      # S3-compatible store with Object Lock for the audit-shipping tests (moto: in-process AWS mock, pinned).
      - name: Start S3 (moto)
        run: |
          python3 -m pip install --quiet 'moto[server]==5.2.3'
          nohup python3 -m moto.server -H 127.0.0.1 -p 5055 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:5055/ && exit 0; sleep 1; done
          cat /tmp/moto.log; exit 1
      - run: npm run typecheck -w @telus/api
      # With the TEST_* variables set, `npm test` runs every suite, including DB, Redis-cluster and Keycloak ones.
      - run: npm test -w @telus/api
      # The same suites again with REQUIRE_*: a missing service fails the build instead of skipping silently.
      - run: npm run test:db -w @telus/api && npm run test:redis -w @telus/api && npm run test:kc -w @telus/api && npm run test:s3 -w @telus/api

  web:
    name: Web — typecheck, unit, build, end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      E2E_DB_ADMIN_URL: postgres://telus_owner:owner@localhost:5432/telus_e2e_test
      E2E_DB_APP_URL: postgres://telus_app:app@localhost:5432/telus_e2e_test
      E2E_REDIS_URL: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: scripts/ci/prepare-services.sh
      - run: npm run typecheck -w @telus/web
      - run: npm test -w @telus/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Builds the production web app, starts it and the API, and drives Chromium through real Keycloak logins.
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
